<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로또 번호 추천</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      font-family: "Segoe UI", "맑은 고딕", sans-serif;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      color: #1e3c72;
    }
    p.subtitle {
      margin: 0 0 24px;
      color: #666;
      font-size: 14px;
    }
    .sets {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }
    .set-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f4f6fb;
      border-radius: 12px;
      padding: 10px 14px;
    }
    .set-label {
      flex: 0 0 32px;
      font-weight: bold;
      color: #1e3c72;
      font-size: 14px;
    }
    .balls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .plus {
      font-weight: bold;
      font-size: 16px;
      color: #999;
      margin: 0 2px;
    }
    .ball {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 15px;
      box-shadow: inset 0 -4px 6px rgba(0, 0, 0, 0.2);
      animation: pop 0.35s ease;
    }
    @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .ball.yellow { background: #fbc400; }
    .ball.blue   { background: #69c8f2; }
    .ball.red    { background: #ff7272; }
    .ball.gray   { background: #aaaaaa; }
    .ball.green  { background: #b0d840; }
    button {
      border: none;
      background: #1e3c72;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      padding: 14px 28px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #2a5298; }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🍀 로또 번호 추천</h1>
    <p class="subtitle">버튼을 누르면 무작위 번호 6개씩 5세트를 뽑아드려요</p>
    <div class="sets" id="sets"></div>
    <button id="generateBtn">번호 뽑기</button>
  </div>
  <script>
    function getBallColorClass(number) {
      if (number <= 10) return "yellow";
      if (number <= 20) return "blue";
      if (number <= 30) return "red";
      if (number <= 40) return "gray";
      return "green";
    }
    function generateLottoNumbers() {
      const numbers = new Set();
      while (numbers.size < 6) {
        numbers.add(Math.floor(Math.random() * 45) + 1);
      }
      let bonus;
      do {
        bonus = Math.floor(Math.random() * 45) + 1;
      } while (numbers.has(bonus));
      return {
        numbers: Array.from(numbers).sort((a, b) => a - b),
        bonus,
      };
    }
    function renderSets(sets) {
      const container = document.getElementById("sets");
      container.innerHTML = "";
      sets.forEach(({ numbers, bonus }, index) => {
        const row = document.createElement("div");
        row.className = "set-row";
        const label = document.createElement("div");
        label.className = "set-label";
        label.textContent = `${index + 1}세트`;
        row.appendChild(label);
        const balls = document.createElement("div");
        balls.className = "balls";
        numbers.forEach((num) => {
          const ball = document.createElement("div");
          ball.className = `ball ${getBallColorClass(num)}`;
          ball.textContent = num;
          balls.appendChild(ball);
        });
        const plus = document.createElement("div");
        plus.className = "plus";
        plus.textContent = "+";
        balls.appendChild(plus);
        const bonusBall = document.createElement("div");
        bonusBall.className = `ball ${getBallColorClass(bonus)}`;
        bonusBall.textContent = bonus;
        balls.appendChild(bonusBall);
        row.appendChild(balls);
        container.appendChild(row);
      });
    }
    document.getElementById("generateBtn").addEventListener("click", () => {
      const sets = Array.from({ length: 5 }, () => generateLottoNumbers());
      renderSets(sets);
    });
  </script>
</body>
</html>
